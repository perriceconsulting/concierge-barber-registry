name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 3am UTC
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwright is intentionally NOT run here. The e2e suite drives a live
      # server against seeded data, and this job has neither: /certificates is
      # gitignored (private keys), so the HTTPS dev server can't start, and
      # DATABASE_URL below points at a Postgres that no service container
      # provides. It failed on every run for months, which taught everyone to
      # ignore this build. Run e2e locally with `npm run test:e2e`.
      #
      # To bring e2e back: add a postgres service, run `prisma migrate deploy`
      # plus a seed, and start the plain-HTTP dev server rather than dev:https.
      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_ACCESS_SECRET: test-access-secret-key-for-testing-only
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-only
          NODE_ENV: test
          CI: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # No coverage gate here on purpose. jest.config.js `coverageThreshold` is
      # the single source for that bar and already fails the run when it isn't
      # met — this step was a second, hardcoded copy (80%) that had drifted from
      # it. Change the threshold in jest.config.js; it is a ratchet, so raise it
      # as coverage grows and never lower it to make a build pass.

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const comment = `## Test Coverage Report

            | Category | Coverage |
            |----------|----------|
            | Lines | ${coverage.total.lines.pct}% |
            | Branches | ${coverage.total.branches.pct}% |
            | Functions | ${coverage.total.functions.pct}% |
            | Statements | ${coverage.total.statements.pct}% |

            ${coverage.total.lines.pct >= 80 ? '✅' : '❌'} Coverage threshold: 80%
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
